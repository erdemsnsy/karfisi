name: Komisyon oranlarını güncelle

on:
  schedule:
    - cron: "0 6 * * 1" # her pazartesi 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run update-commissions
      # Oranlar değiştiyse doğrudan main'e işlenir; Vercel siteyi kendiliğinden yeniler.
      - name: Değişiklik varsa yayınla
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/komisyon-oranlari.json
            git commit -m "chore: komisyon oranlarını güncelle"
            git push
          fi
